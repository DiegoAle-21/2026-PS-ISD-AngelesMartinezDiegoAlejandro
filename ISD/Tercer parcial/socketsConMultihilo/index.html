<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones ejemplo</title>
</head>
<body>
    <h1>Notificaciones Ejemplo</h1>
    <p>Estado: <span id="estado" class="desconectado">desconectado</span></p>
    <p>Corre <code>node seridor.js</code> y en su terminal veras el estado del servdo.</p>
    <ul id="lista">

    </ul>
    
    <script>
        const estado = document.getElementById('estado');
        const lista = document.getElementById('lista');

        //necesitamos un socket con protocolo TCP
        //un websocket es un socken con protocolo TCP
        const socket = new WebSocket(`ws://${location.host}`);

        socket.addEventListener('open', () =>{
            estado.textContent = 'conectado';
            estado.textContent = 'conectado';
        });

        socket.addEventListener('close', () =>{
            estado.textContent = 'desconectado';
            estado.textContent = 'desconectado';
        });

        socket.addEventListener('message', (event) =>{
            const {tipo, mensaje, fecha} = JSON.parse(evento.data);
            const item = document.createElement('li');
            item.innerHTML = `
            <time>${new Date(fecha).toLocalDateString()} </time> Tipo de Estado [${tipo}] Mensaje: ${mensaje}
            `;
            lista.prepend(item);
        });
    </script>

</body>
</html>
